version: '3.8'

services:
  # ----------------------------------------------------
  # FRONTEND: NEXT.JS 15
  # ----------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: eoms_frontend
    restart: unless-stopped
    ports:
      - "3004:3004"
    environment:
      - NODE_ENV=development
      - HOSTNAME=0.0.0.0
      - PORT=3004
      - WATCHPACK_POLLING=true
      - NEXT_PUBLIC_API_URL=http://localhost:8086/api/v1
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    networks:
      - eoms_net

  # ----------------------------------------------------
  # BACKEND: FASTAPI
  # ----------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: eoms_backend
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8086 --reload
    ports:
      - "8086:8086"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5434/eoms_db
      - REDIS_URL=redis://redis:6377/0
      - MINIO_URL=http://minio:9004
      - MINIO_ACCESS_KEY=admin
      - MINIO_SECRET_KEY=admin123
      - JWT_SECRET=super_secret_eoms_key_change_me
    volumes:
      - ./backend:/app
    depends_on:
      - db
      - redis
      - minio
    networks:
      - eoms_net

  # ----------------------------------------------------
  # DATABASE: POSTGRESQL
  # ----------------------------------------------------
  db:
    image: postgres:15-alpine
    container_name: eoms_db
    restart: unless-stopped
    command: postgres -p 5434
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=eoms_db
    ports:
      - "5434:5434"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - eoms_net

  # ----------------------------------------------------
  # CACHE & QUEUE: REDIS
  # ----------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: eoms_redis
    restart: unless-stopped
    command: redis-server --port 6377
    ports:
      - "6377:6377"
    volumes:
      - redisdata:/data
    networks:
      - eoms_net

  # ----------------------------------------------------
  # STORAGE: MINIO (S3 Alternative)
  # ----------------------------------------------------
  minio:
    image: minio/minio
    container_name: eoms_minio
    restart: unless-stopped
    ports:
      - "9004:9004"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=admin123
    command: server /data --address ":9004" --console-address ":9001"
    volumes:
      - miniodata:/data
    networks:
      - eoms_net

networks:
  eoms_net:
    driver: bridge

volumes:
  pgdata:
  redisdata:
  miniodata:
