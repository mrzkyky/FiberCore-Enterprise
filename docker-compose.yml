services:
  # ----------------------------------------------------
  # FRONTEND: REACT + VITE (FIBERCORE ENTERPRISE)
  # ----------------------------------------------------
  frontend:
    build:
      context: ./frontend_old
      dockerfile: Dockerfile
    container_name: eoms_frontend
    restart: unless-stopped
    ports:
      - "3004:3004"
    environment:
      - VITE_API_URL=http://localhost:8086/api/v1
      - BACKEND_URL=http://backend:8086
    volumes:
      - ./frontend_old:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - eoms_net

  # ----------------------------------------------------
  # BACKEND: FASTAPI (FIBERCORE ENTERPRISE)
  # ----------------------------------------------------
  backend:
    build:
      context: ./backend_old
      dockerfile: Dockerfile
    container_name: eoms_backend
    restart: unless-stopped
    command: uvicorn main:app --host 0.0.0.0 --port 8086 --reload
    ports:
      - "8086:8086"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5434/eoms_db
      - POSTGRES_SERVER=db
      - POSTGRES_PORT=5434
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=eoms_db
      - REDIS_URL=redis://redis:6377/0
      - MINIO_URL=http://minio:9004
      - MINIO_ACCESS_KEY=admin
      - MINIO_SECRET_KEY=admin123
      - JWT_SECRET=super_secret_eoms_key_change_me
    volumes:
      - ./backend_old:/app
    depends_on:
      - db
      - redis
      - minio
    networks:
      - eoms_net

  # ----------------------------------------------------
  # DATABASE: POSTGIS / POSTGRESQL
  # ----------------------------------------------------
  db:
    image: postgis/postgis:15-3.4-alpine
    container_name: eoms_db
    restart: unless-stopped
    command: postgres -p 5434
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=eoms_db
    ports:
      - "5434:5434"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - eoms_net

  # ----------------------------------------------------
  # CACHE & QUEUE: REDIS
  # ----------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: eoms_redis
    restart: unless-stopped
    command: redis-server --port 6377
    ports:
      - "6377:6377"
    volumes:
      - redisdata:/data
    networks:
      - eoms_net

  # ----------------------------------------------------
  # STORAGE: MINIO (S3 Alternative)
  # ----------------------------------------------------
  minio:
    image: minio/minio
    container_name: eoms_minio
    restart: unless-stopped
    ports:
      - "9004:9004"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=admin123
    command: server /data --address ":9004" --console-address ":9001"
    volumes:
      - miniodata:/data
    networks:
      - eoms_net

networks:
  eoms_net:
    driver: bridge

volumes:
  pgdata:
  redisdata:
  miniodata:
